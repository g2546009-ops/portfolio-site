<!DOCTYPE html>
<html lang="ja">
<head>

<body>
    <header>

            <h1>

    <h3>About</h3>

    <p>
        伊藤 勇翔<br>
    </p>

    <p>趣味：ライブハウス巡り</p>

    <div class="favorite-artist">
        <span class="artist-label">MY FAVORITE ARTIST</span>
        <h4>フジタカコ</h4>

            力強いギターストロークと心に響く歌声が魅力の

        <div class="artist-links">

            <a href="https://fujitakako.com/"
               target="_blank" rel="noopener noreferrer">

            </a>

            <a href="https://fujitakako.bitfan.id/"
               target="_blank" rel="noopener noreferrer">
                ファンクラブ ↗
            </a>

</section>

        <section id="journey">

                </p>

                <div class="works-controls">
                    <select id="category" aria-label="カテゴリ">
                        <option value="all">すべてのカテゴリ</option>
                    </select>

                    <select id="sort" aria-label="並び替え">
                        <option value="default">元の順番</option>
                        <option value="title">名前順</option>
                    </select>
                </div>

                <div id="works-grid"></div>
            </section>

    <footer>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle Log</title>

    <link rel="stylesheet" href="style.css">
    <script src="sketch.js" defer></script>
    <script src="works.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="index.html">MUSCLE<span>LOG</span></a>

            <nav class="segmented" aria-label="画面切り替え">
                <button id="todayButton" type="button" aria-pressed="true">今日</button>
                <button id="historyButton" type="button" aria-pressed="false">履歴</button>
                <button id="stretchButton" type="button" aria-pressed="false">ストレッチ一覧</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="panel-heading page-heading">
            <div>
                <p id="dateLabel" class="accent"></p>
                <h1 id="pageTitle">今日のトレーニング</h1>
            </div>

            <p id="stats" class="muted"></p>
        </div>

        <p id="message" role="status"></p>

        <section id="historyList" class="panel history-list" hidden>
        </section>

        <div id="dashboard" class="dashboard">
            <section class="panel map-panel">
                <div class="panel-heading">
                    <h2>筋肉マップ</h2>

                    <div class="segmented" role="group" aria-label="マネキンの向き">
                        <button id="frontButton" type="button" aria-pressed="true">前面</button>
                        <button id="backButton" type="button" aria-pressed="false">背面</button>
                    </div>
                </div>

                <div class="map-stage">
                    <canvas
                        id="bodyCanvas"
                        width="640"
                        height="1000"
                        role="img"
                        aria-label="筋肉マップ。下の部位一覧からも選択できます。"
                    ></canvas>

                    <div id="muscleTooltip" aria-hidden="true" hidden></div>
                </div>

                <p class="muted small">その部位を主に狙った種目数</p>

                <div class="legend">
                    <span><i class="level-0"></i>0種目</span>
                    <span><i class="level-1"></i>1種目</span>
                    <span><i class="level-2"></i>2種目</span>
                    <span><i class="level-3"></i>3種目以上</span>
                </div>

                <label for="partSelect">部位から選ぶ</label>
                <select id="partSelect"></select>
            </section>

            <div class="stack">
                <section id="partPanel" class="panel" hidden>
                    <h2 id="partTitle"></h2>
                    <p id="partDescription" class="muted"></p>
                    <p id="partSummary" class="accent"></p>

                    <button id="partStretchButton" type="button">
                        この部位のルーティンを見る
                    </button>
                </section>

                <section id="recordPanel" class="panel">
                    <h2>セットを記録</h2>

                    <form id="recordForm">
                        <label for="exerciseSelect">種目</label>
                        <select id="exerciseSelect" required></select>

                        <div id="setFields" hidden>
                            <p id="exerciseParts" class="muted"></p>

                            <div class="previous">
                                <p id="previousRecord"></p>

                                <button id="copyButton" type="button" hidden>
                                    前回をコピー
                                </button>
                            </div>

                            <div class="set-grid set-headings" aria-hidden="true">
                                <span>セット</span>
                                <span>重量（kg）</span>
                                <span>回数</span>
                                <span></span>
                            </div>

                            <div id="setRows"></div>

                            <div class="actions">
                                <button id="addSetButton" type="button">＋ セット</button>
                                <button class="primary" type="submit">記録を保存</button>
                            </div>
                        </div>
                    </form>

                    <details id="customDetails">
                        <summary>＋ 自分の種目を追加</summary>

                        <form id="customForm">
                            <label for="customName">種目名</label>
                            <input id="customName" maxlength="60" required>

                            <label for="customPart">主に狙う部位</label>
                            <select id="customPart" required></select>

                            <button type="submit">種目を追加</button>
                        </form>
                    </details>
                </section>

                <section class="panel">
                    <div class="panel-heading">
                        <h2 id="recordTitle">今日の記録</h2>

                        <button id="clearFilterButton" type="button" hidden>
                            全部位を表示
                        </button>
                    </div>

                    <div id="recordList"></div>
                </section>
            </div>
        </div>

        <section id="stretchScreen" class="stretch-layout" hidden>
            <div class="panel">
                <label for="routineSelect">今日鍛える部位</label>
                <select id="routineSelect"></select>

                <h2 id="routineTitle"></h2>
                <p id="routineNote" class="muted"></p>

                <ol id="routineList" class="routine-list"></ol>

                <p class="muted small">
                    軽く身体を動かしてから、痛みのない範囲で行ってください。
                    器具を使う任意メニューは、器具が空いているときに選べます。
                </p>
            </div>

            <div class="panel">
                <div class="panel-heading">
                    <h2 id="movementName"></h2>
                    <span id="movementEquipment" class="equipment"></span>
                </div>

                <figure class="movement-stage">
                    <canvas
                        id="movementCanvas"
                        width="960"
                        height="540"
                        role="img"
                        aria-describedby="movementSteps"
                    ></canvas>

                    <figcaption id="movementPhase">準備</figcaption>
                </figure>

                <div class="movement-controls">
                    <button id="playButton" type="button">動きを再生</button>
                    <button id="resetButton" type="button">最初に戻す</button>

                    <label for="speedSelect">速度</label>
                    <select id="speedSelect">
                        <option value="1">通常</option>
                        <option value="0.55">ゆっくり</option>
                    </select>
                </div>

                <ol id="movementSteps"></ol>

                <a id="movementSource" target="_blank" rel="noopener">
                    参考資料
                </a>
            </div>
        </section>
    </main>

    <dialog id="editDialog" aria-labelledby="editTitle">
        <div class="panel-heading">
            <div>
                <p id="editDate" class="accent small"></p>
                <h2 id="editTitle">トレーニング記録を編集</h2>
            </div>

            <button id="closeEditButton" type="button" aria-label="編集を閉じる">
                ×
            </button>
        </div>

        <form id="editForm">
            <label for="editExercise">種目</label>
            <select id="editExercise" required></select>

            <p id="editParts" class="muted"></p>

            <div class="set-grid set-headings" aria-hidden="true">
                <span>セット</span>
                <span>重量（kg）</span>
                <span>回数</span>
                <span></span>
            </div>

            <div id="editRows"></div>

            <p id="editMessage" role="status"></p>

            <div class="actions">
                <button id="editAddSetButton" type="button">＋ セット</button>
                <button class="primary" type="submit">変更を保存</button>
            </div>
        </form>

        <details id="deleteDetails">
            <summary>この種目の記録を削除</summary>

            <p>この日付のこの種目について、すべてのセットを削除します。</p>

            <button id="deleteRecordButton" class="danger" type="button">
                削除を確定
            </button>
        </details>
    </dialog>
</body>
</html>

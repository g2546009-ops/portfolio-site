<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle Log</title>
    <link rel="stylesheet" href="style.css">
    <script src="sketch.js" defer></script>
    <script src="works.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container heading">
            <a href="./" class="brand">MUSCLE <span>LOG</span></a>

            <nav aria-label="画面切り替え">
                <button id="today" type="button" aria-pressed="true">今日</button>
                <button id="history" type="button" aria-pressed="false">履歴</button>
                <button id="stretch" type="button" aria-pressed="false">ストレッチ一覧</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <p id="date" class="muted"></p>
        <h1 id="title">今日のトレーニング</h1>
        <p id="message" role="status"></p>

        <section id="history-list" class="panel" hidden aria-label="日付別の履歴"></section>

        <div id="dashboard" class="dashboard">
            <section class="panel">
                <div class="heading">
                    <h2>筋肉マップ</h2>

                    <div class="segmented" role="group" aria-label="マネキンの向き">
                        <button id="front" type="button" aria-pressed="true">前面</button>
                        <button id="back" type="button" aria-pressed="false">背面</button>
                    </div>
                </div>

                <div class="map-stage">
                    <canvas id="body" width="640" height="1000" role="img"
                        aria-label="筋肉マップ。下の一覧からも部位を選べます。"></canvas>

                    <span id="tooltip" hidden aria-hidden="true"></span>
                </div>

                <p class="muted">部位を主に狙った種目数</p>
                <p class="legend today-legend">0種目　／　1種目　／　2種目　／　3種目以上</p>

                <label for="part">部位を選ぶ</label>
                <select id="part"></select>

                <div id="part-detail" hidden>
                    <h3 id="part-name"></h3>
                    <p id="part-description"></p>
                    <p id="part-count" class="muted"></p>
                    <button id="part-routine" type="button">この部位のルーティンを見る</button>
                </div>
            </section>

            <div class="stack">
                <section id="record-panel" class="panel">
                    <h2>セットを記録</h2>

                    <form id="record-form">
                        <label for="exercise">種目</label>
                        <select id="exercise" required></select>

                        <div id="set-fields" hidden>
                            <p id="exercise-parts" class="muted"></p>

                            <div class="previous">
                                <p id="previous"></p>
                                <button id="copy" type="button" hidden>前回をコピー</button>
                            </div>

                            <div class="set-grid muted" aria-hidden="true">
                                <span>セット</span>
                                <span>重量（kg）</span>
                                <span>回数</span>
                                <span></span>
                            </div>

                            <div id="sets"></div>

                            <div class="heading">
                                <button id="add-set" type="button">＋ セット</button>
                                <button class="primary" type="submit">記録を保存</button>
                            </div>
                        </div>
                    </form>

                    <details id="custom-details">
                        <summary>＋ 自分の種目を追加</summary>

                        <form id="custom-form">
                            <label for="custom-name">種目名</label>
                            <input id="custom-name" maxlength="60" required>

                            <label for="custom-part">主に狙う部位</label>
                            <select id="custom-part" required></select>

                            <button type="submit">種目を追加</button>
                        </form>
                    </details>
                </section>

                <section class="panel">
                    <div class="heading">
                        <h2 id="log-title">今日の記録</h2>
                        <button id="clear-filter" type="button" hidden>全部位を表示</button>
                    </div>

                    <div id="log"></div>
                </section>

                <section id="weekly" class="panel weekly">
                    <div class="heading week-heading">
                        <h2>週間トレーニング分析</h2>

                        <div class="week-nav" role="group" aria-label="集計する週">
                            <button id="prev-week" type="button" aria-label="前週">‹</button>
                            <span id="week-range"></span>
                            <button id="next-week" type="button" aria-label="次週">›</button>
                        </div>
                    </div>

                    <p id="week-summary" class="week-summary"></p>
                    <h3>部位別セット数</h3>

                    <div class="week-body">
                        <div id="week-left" class="week-parts"></div>

                        <div class="week-model">
                            <canvas id="week-front" width="320" height="500"
                                role="img" aria-label="週間筋肉マップの前面"></canvas>
                            <span>前面</span>
                        </div>

                        <div class="week-model">
                            <canvas id="week-back" width="320" height="500"
                                role="img" aria-label="週間筋肉マップの背面"></canvas>
                            <span>背面</span>
                        </div>

                        <div id="week-right" class="week-parts"></div>
                    </div>

                    <div class="legend week-legend" aria-label="週間マップの色の凡例">
                        <span><i></i>0</span>
                        <span><i></i>1〜3</span>
                        <span><i></i>4〜7</span>
                        <span><i></i>8以上</span>
                    </div>

                    <p id="week-detail" class="week-detail" aria-live="polite"></p>

                    <h3>曜日別セット数</h3>
                    <div id="week-bars" class="week-bars"></div>
                </section>
            </div>
        </div>

        <section id="stretch-screen" class="stretch-layout" hidden>
            <div class="panel">
                <label for="routine">今日鍛える部位</label>
                <select id="routine"></select>
                <ol id="routine-list"></ol>
            </div>

            <div class="panel">
                <div class="heading">
                    <h2 id="movement-name"></h2>
                    <span id="equipment" class="muted"></span>
                </div>

                <canvas id="movement" width="960" height="480" role="img"
                    aria-describedby="steps"></canvas>

                <div class="movement-controls">
                    <button id="play" type="button">動きを再生</button>
                    <button id="reset" type="button">最初に戻す</button>

                    <label for="speed">速度</label>
                    <select id="speed">
                        <option value="1">通常</option>
                        <option value="0.55">ゆっくり</option>
                    </select>
                </div>

                <ol id="steps"></ol>
                <p class="muted">ゆっくり、痛みのない範囲で動かしてください。</p>
                <a id="source" target="_blank" rel="noopener noreferrer">参考資料</a>
            </div>
        </section>
    </main>

    <dialog id="edit-dialog" aria-labelledby="edit-title">
        <div class="heading">
            <div>
                <p id="edit-date" class="muted"></p>
                <h2 id="edit-title">記録を編集</h2>
            </div>

            <button id="close-edit" type="button" aria-label="閉じる">×</button>
        </div>

        <form id="edit-form">
            <label for="edit-exercise">種目</label>
            <select id="edit-exercise" required></select>

            <div class="set-grid muted" aria-hidden="true">
                <span>セット</span>
                <span>重量（kg）</span>
                <span>回数</span>
                <span></span>
            </div>

            <div id="edit-sets"></div>
            <p id="edit-message" role="status"></p>

            <div class="heading">
                <button id="edit-add" type="button">＋ セット</button>
                <button class="primary" type="submit">変更を保存</button>
            </div>
        </form>

        <details id="delete-details">
            <summary>この種目の記録を削除</summary>
            <p>この日付の、この種目の全セットを削除します。</p>
            <button id="delete" type="button">削除を確定</button>
        </details>
    </dialog>
</body>
</html>
